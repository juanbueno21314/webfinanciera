<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Asistente IA - Zenfi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/zenfi_icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at top left,rgba(13,110,253,.08),transparent 28%),radial-gradient(circle at bottom right,rgba(25,135,84,.06),transparent 30%),linear-gradient(135deg,#f8fafc,#eef2f7); font-family:"Segoe UI",sans-serif; color:#0f172a; margin:0; }
        .main-content { margin-left:260px; height:100vh; display:flex; flex-direction:column; }
        .chat-wrapper { flex:1; display:flex; flex-direction:column; max-width:820px; margin:0 auto; width:100%; padding:1.5rem 1.5rem 0; }
        .chat-header { background:#fff; border-radius:16px; padding:1rem 1.5rem; box-shadow:0 4px 16px rgba(15,23,42,.08); display:flex; align-items:center; gap:1rem; margin-bottom:1rem; }
        .chat-avatar { width:44px; height:44px; background:linear-gradient(135deg,#0d6efd,#3b82f6); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; flex-shrink:0; }
        .chat-messages { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:.9rem; padding-bottom:1rem; }
        .bubble { max-width:78%; padding:.85rem 1.1rem; border-radius:16px; font-size:.92rem; line-height:1.6; }
        .bubble-user { background:#0d6efd; color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
        .bubble-ia { background:#fff; border:1px solid #e2e8f0; color:#0f172a; align-self:flex-start; border-bottom-left-radius:4px; box-shadow:0 2px 8px rgba(15,23,42,.06); }
        .ia-label { font-size:.72rem; color:#94a3b8; margin-bottom:.35rem; font-weight:600; }
        .typing span { width:7px; height:7px; background:#94a3b8; border-radius:50%; display:inline-block; animation:bounce 1.2s infinite; }
        .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
        @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
        .chat-input-area { background:#fff; border-top:1px solid #f1f5f9; padding:1rem 1.5rem; display:flex; gap:.75rem; align-items:flex-end; max-width:820px; margin:0 auto; width:100%; }
        #msgInput { border-radius:12px; border:1px solid #e2e8f0; padding:.7rem 1rem; flex:1; font-size:.9rem; resize:none; outline:none; transition:border-color .15s; }
        #msgInput:focus { border-color:#86b7fe; }
        .btn-send { background:#0d6efd; color:#fff; border:none; border-radius:12px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .15s; flex-shrink:0; }
        .btn-send:hover { background:#0b5ed7; }
        .suggestions { display:flex; gap:.5rem; flex-wrap:wrap; padding:.75rem 1.5rem 0; max-width:820px; margin:0 auto; width:100%; }
        .sug-btn { font-size:.78rem; background:#fff; border:1px solid #e2e8f0; color:#475569; border-radius:20px; padding:.3rem .85rem; cursor:pointer; transition:all .15s; }
        .sug-btn:hover { background:#eff6ff; border-color:#bfdbfe; color:#0d6efd; }
        @media(max-width:991px){.main-content{margin-left:0}}
    </style>
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="main-content">
    <div class="chat-wrapper">
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-avatar">🤖</div>
            <div class="flex-grow-1">
                <div class="fw-bold" style="font-size:1rem;">Asistente Financiero IA</div>
                <div style="font-size:.78rem;color:#10b981;">● En línea · Conoce tus finanzas personales</div>
            </div>
            <a th:href="@{/dashboard}" class="btn btn-sm btn-outline-secondary" style="border-radius:10px;font-size:.82rem;">← Inicio</a>
        </div>

        <!-- Mensajes -->
        <div class="chat-messages" id="chatMessages">
            <div class="bubble bubble-ia">
                <div class="ia-label">🤖 ASISTENTE IA</div>
                Hola, soy tu asistente financiero. Tengo acceso a tus ingresos, deudas, gastos y metas registrados en Zenfi. ¿En qué te puedo ayudar hoy?
            </div>
        </div>
    </div>

    <!-- Sugerencias -->
    <div class="suggestions" id="sugerencias">
        <button class="sug-btn" onclick="enviarSugerencia('¿Cómo está mi situación financiera general?')">¿Cómo están mis finanzas?</button>
        <button class="sug-btn" onclick="enviarSugerencia('¿Cuánto debería ahorrar este mes según mis ingresos?')">¿Cuánto ahorrar este mes?</button>
        <button class="sug-btn" onclick="enviarSugerencia('¿Cómo puedo reducir mis deudas más rápido?')">¿Cómo reducir deudas?</button>
        <button class="sug-btn" onclick="enviarSugerencia('Dame un plan de ahorro para los próximos 3 meses')">Plan de ahorro 3 meses</button>
        <button class="sug-btn" onclick="enviarSugerencia('¿Estoy gastando demasiado según mis ingresos?')">¿Gasto demasiado?</button>
        <button class="sug-btn" onclick="enviarSugerencia('¿Cómo empiezo a invertir con poco dinero?')">¿Cómo empezar a invertir?</button>
        <button class="sug-btn" onclick="enviarSugerencia('¿Qué es un fondo de emergencia y cuánto debería tener?')">Fondo de emergencia</button>
        <button class="sug-btn" onclick="enviarSugerencia('¿Cómo priorizo qué deuda pagar primero?')">¿Qué deuda pagar primero?</button>
        <button class="sug-btn" onclick="enviarSugerencia('Explícame el interés compuesto con un ejemplo')">Interés compuesto</button>
        <button class="sug-btn" onclick="enviarSugerencia('¿Cuánto debería gastar en arriendo o vivienda?')">Regla de vivienda</button>
        <button class="sug-btn" onclick="enviarSugerencia('¿Cómo puedo mejorar mi historial crediticio?')">Mejorar crédito</button>
        <button class="sug-btn" onclick="enviarSugerencia('¿Qué porcentaje de mis ingresos debería ir a cada categoría de gasto?')">Regla 50/30/20</button>
    </div>

    <!-- Input -->
    <div class="chat-input-area">
        <textarea id="msgInput" placeholder="Escribe tu pregunta financiera..." rows="1" maxlength="500"></textarea>
        <button class="btn-send" onclick="enviarMensaje()"><i class="bi bi-send-fill"></i></button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const msgInput = document.getElementById('msgInput');

    msgInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarMensaje(); }
    });
    msgInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    function enviarSugerencia(texto) { msgInput.value = texto; enviarMensaje(); }

    function enviarMensaje() {
        const texto = msgInput.value.trim();
        if (!texto) return;
        agregarBurbuja(texto, 'user');
        msgInput.value = ''; msgInput.style.height = 'auto';
        const typing = agregarTyping();

        fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mensaje: texto })
        })
        .then(r => r.json())
        .then(d => { typing.remove(); agregarBurbuja(d.respuesta, 'ia'); })
        .catch(() => { typing.remove(); agregarBurbuja('Ocurrió un error al conectar con la IA. Intenta de nuevo.', 'ia'); });
    }

    function agregarBurbuja(texto, tipo) {
        const div = document.createElement('div');
        div.className = tipo === 'user' ? 'bubble bubble-user' : 'bubble bubble-ia';
        if (tipo === 'ia') {
            div.innerHTML = `<div class="ia-label">🤖 ASISTENTE IA</div>${escapeHtml(texto).replace(/\n/g,'<br>')}`;
        } else {
            div.textContent = texto;
        }
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function agregarTyping() {
        const div = document.createElement('div');
        div.className = 'bubble bubble-ia typing d-flex gap-1 align-items-center';
        div.innerHTML = '<span></span><span></span><span></span>';
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return div;
    }

    function escapeHtml(t) {
        return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
</script>
</body>
</html>
