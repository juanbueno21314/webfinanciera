<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${leccion.titulo} + ' - Zenfi'">Lección - Zenfi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/zenfi_icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at top left,rgba(13,110,253,.08),transparent 28%),radial-gradient(circle at bottom right,rgba(25,135,84,.06),transparent 30%),linear-gradient(135deg,#f8fafc,#eef2f7); font-family:"Segoe UI",sans-serif; color:#0f172a; }
        .main-content { margin-left:260px; padding:2rem; min-height:100vh; }
        .zen-card { background:#fff; border-radius:20px; box-shadow:0 8px 24px rgba(15,23,42,.08); border:none; padding:2rem; }
        .zen-card p { color:#334155; font-size:1.05rem; line-height:1.75; }
        .btn-zen { border-radius:12px; font-weight:600; padding:.7rem 1.5rem; }
        .ratio iframe { border-radius:14px; }
        @media(max-width:991px){.main-content{margin-left:0}}
    </style>
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="main-content">
    <div style="max-width:860px;margin:0 auto;">

        <div class="mb-3">
            <a th:href="@{'/aprende/' + ${leccion.categoria}}" style="font-size:.85rem;color:#64748b;text-decoration:none;">← Volver a lecciones</a>
        </div>

        <h2 style="font-size:1.6rem;font-weight:700;margin-bottom:1.5rem;" th:text="${leccion.titulo}">Título</h2>

        <div class="zen-card mb-4">
            <div th:utext="${leccion.contenidoIntro}"></div>

            <div class="mt-4" th:if="${leccion.videoUrl != null}">
                <div class="ratio ratio-16x9">
                    <iframe th:src="${leccion.videoUrl}" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{'/aprende/quizz/' + ${leccion.id}}" class="btn btn-zen btn-success px-5">
                    Comenzar preguntas →
                </a>
            </div>
        </div>

        <div class="text-center">
            <a th:href="@{'/aprende/' + ${leccion.categoria}}" class="btn btn-zen btn-outline-secondary">← Volver a lecciones</a>
        </div>
    </div>
</div>
</body>
</html>
