<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lecciones | [[${categoria}]]</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom right, #e0f7fa, #fefefe);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h2 {
            font-size: 2.3rem;
            font-weight: bold;
            color: #0d6efd;
            margin-bottom: 2.5rem;
            animation: fadeInDown 0.6s ease;
        }

        .leccion-card {
            border-radius: 20px;
            padding: 24px;
            background-color: #ffffff;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            animation: fadeInUp 0.5s ease;
        }

        .leccion-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
        }

        .titulo-leccion {
            font-size: 1.2rem;
            font-weight: 600;
            color: #343a40;
            margin-bottom: 1.2rem;
        }

        .btn-leccion {
            background-color: #0d6efd;
            color: white;
            font-weight: 600;
            border-radius: 12px;
            padding: 10px;
            margin-top: auto;
            transition: background-color 0.2s ease;
        }

        .btn-leccion:hover {
            background-color: #0b5ed7;
        }

        .badge-completa {
            background-color: #198754;
            color: white;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
            margin-top: 15px;
            display: inline-block;
            animation: fadeIn 0.5s ease-in;
        }

        .btn-outline-secondary {
            border-radius: 10px;
            padding: 10px 24px;
            font-weight: 500;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
<div class="container py-5">
    <h2 class="text-center">📚 Lecciones sobre <span th:text="${categoria}">Categoría</span></h2>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mt-4">
        <div class="col" th:each="leccion : ${lecciones}">
            <div class="leccion-card text-center">
                <div class="titulo-leccion" th:text="${leccion.titulo}">Título</div>
                <a th:href="@{'/aprende/detalle/' + ${leccion.id}}" class="btn btn-leccion">Ver lección</a>
                <div th:if="${completadas.contains(leccion.id)}" class="badge-completa">
                    ✅ Completada
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-5">
        <a href="/aprende" class="btn btn-outline-secondary">← Volver</a>
    </div>
</div>
</body>
</html>
