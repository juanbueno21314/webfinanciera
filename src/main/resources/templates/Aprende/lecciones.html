<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="'Lecciones · ' + ${categoria} + ' - Zenfi'">Lecciones - Zenfi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/zenfi_icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at top left,rgba(13,110,253,.08),transparent 28%),radial-gradient(circle at bottom right,rgba(25,135,84,.06),transparent 30%),linear-gradient(135deg,#f8fafc,#eef2f7); font-family:"Segoe UI",sans-serif; color:#0f172a; }
        .main-content { margin-left:260px; padding:2rem; min-height:100vh; }
        .leccion-card { background:#fff; border-radius:18px; box-shadow:0 6px 20px rgba(15,23,42,.08); border:none; padding:1.5rem; transition:transform .2s,box-shadow .2s; display:flex; flex-direction:column; height:100%; }
        .leccion-card:hover { transform:translateY(-5px); box-shadow:0 14px 30px rgba(15,23,42,.12); }
        .btn-zen { border-radius:12px; font-weight:600; padding:.65rem 1.2rem; }
        .badge-done { background:#dcfce7; color:#166534; border-radius:8px; font-size:.78rem; padding:.25rem .65rem; }
        @media(max-width:991px){.main-content{margin-left:0}}
    </style>
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="main-content">

    <div class="mb-4">
        <a href="/aprende" style="font-size:.85rem;color:#64748b;text-decoration:none;">← Aprende</a>
        <h2 style="font-size:1.6rem;font-weight:700;margin-top:.25rem;">
            📚 Lecciones sobre <span th:text="${categoria}">Categoría</span>
        </h2>
        <p class="text-muted">Completa cada lección para avanzar en tu educación financiera.</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="leccion, iterStat : ${lecciones}">
            <div class="leccion-card">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <span style="background:#f1f5f9;color:#475569;border-radius:8px;font-size:.78rem;padding:.25rem .65rem;font-weight:600;">
                        Lección <span th:text="${iterStat.count}">1</span>
                    </span>
                    <span class="badge-done" th:if="${completadas.contains(leccion.id)}">✓ Completada</span>
                </div>

                <h5 class="fw-bold mb-2" style="font-size:1rem;line-height:1.4;" th:text="${leccion.titulo}">Título</h5>

                <div class="mt-auto pt-3">
                    <a th:href="@{'/aprende/detalle/' + ${leccion.id}}"
                       class="btn btn-zen w-100"
                       th:classappend="${completadas.contains(leccion.id)} ? 'btn-outline-success' : 'btn-primary'">
                        <span th:if="${completadas.contains(leccion.id)}">Repasar lección</span>
                        <span th:unless="${completadas.contains(leccion.id)}">Ver lección →</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-5">
        <a href="/aprende" class="btn btn-zen btn-outline-secondary">← Volver a categorías</a>
    </div>
</div>
</body>
</html>
