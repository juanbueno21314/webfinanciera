<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Plan de Ahorro · Paso 3 - Zenfi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/zenfi_icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at top left,rgba(13,110,253,.08),transparent 28%),radial-gradient(circle at bottom right,rgba(25,135,84,.06),transparent 30%),linear-gradient(135deg,#f8fafc,#eef2f7); font-family:"Segoe UI",sans-serif; color:#0f172a; }
        .main-content { margin-left:260px; padding:2rem; min-height:100vh; }
        .zen-card { background:#fff; border-radius:20px; box-shadow:0 8px 24px rgba(15,23,42,.08); border:none; }
        .step-indicator { display:flex; gap:.5rem; margin-bottom:2rem; }
        .step { flex:1; height:6px; border-radius:999px; background:#e2e8f0; }
        .step.done { background:#10b981; }
        .step.active { background:#0d6efd; }
        .form-control,.form-select { border-radius:12px; padding:.75rem 1rem; border:1px solid #e2e8f0; }
        .form-control:focus,.form-select:focus { border-color:#86b7fe; box-shadow:0 0 0 .2rem rgba(13,110,253,.12); }
        .btn-zen { border-radius:12px; font-weight:600; padding:.7rem 1.5rem; }
        @media(max-width:991px){.main-content{margin-left:0}}
    </style>
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="main-content">
    <div style="max-width:600px;margin:0 auto;">

        <div class="mb-4">
            <p class="text-muted mb-1" style="font-size:.85rem;">Plan de ahorro</p>
            <h2 style="font-size:1.6rem;font-weight:700;">💰 Establece tu plan</h2>
        </div>

        <div class="step-indicator">
            <div class="step done"></div>
            <div class="step done"></div>
            <div class="step active"></div>
        </div>
        <div class="d-flex justify-content-between mb-4" style="font-size:.8rem;color:#64748b;">
            <span style="color:#10b981;font-weight:600;">✓ Tu sueño</span>
            <span style="color:#10b981;font-weight:600;">✓ Monto</span>
            <span style="color:#0d6efd;font-weight:600;">Paso 3 · Plan</span>
        </div>

        <div class="zen-card p-4">
            <h5 class="fw-bold mb-1">¿Cuándo y con qué frecuencia?</h5>
            <p class="text-muted mb-4" style="font-size:.9rem;">Define tu fecha límite y la frecuencia con la que vas a ahorrar.</p>

            <form th:action="@{/ahorro/paso3(id=${metaAhorro.id})}" method="post" th:object="${metaAhorro}">
                <div class="mb-3">
                    <label for="fechaFinal" class="form-label fw-semibold">Fecha límite para alcanzar tu meta</label>
                    <input type="date" th:field="*{fechaFinal}" id="fechaFinal" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label for="frecuencia" class="form-label fw-semibold">Frecuencia de ahorro</label>
                    <select th:field="*{frecuencia}" id="frecuencia" class="form-select" required>
                        <option value="">Selecciona...</option>
                        <option th:each="opcion : ${frecuencias}" th:value="${opcion}" th:text="${opcion}"></option>
                    </select>
                </div>

                <div class="d-flex gap-3">
                    <a th:href="@{'/ahorro/paso2'(id=${metaAhorro.id})}" class="btn btn-zen btn-outline-secondary flex-fill">← Atrás</a>
                    <button type="submit" class="btn btn-zen btn-success flex-fill">Ver resumen →</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
