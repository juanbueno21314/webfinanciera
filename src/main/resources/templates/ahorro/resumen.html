<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resumen de tu Plan - Zenfi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/zenfi_icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at top left,rgba(13,110,253,.08),transparent 28%),radial-gradient(circle at bottom right,rgba(25,135,84,.06),transparent 30%),linear-gradient(135deg,#f8fafc,#eef2f7); font-family:"Segoe UI",sans-serif; color:#0f172a; }
        .main-content { margin-left:260px; padding:2rem; min-height:100vh; }
        .zen-card { background:#fff; border-radius:20px; box-shadow:0 8px 24px rgba(15,23,42,.08); border:none; }
        .detail-row { display:flex; align-items:center; gap:.75rem; padding:.9rem 0; border-bottom:1px solid #f1f5f9; }
        .detail-row:last-child { border-bottom:none; }
        .detail-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; }
        .detail-label { font-size:.82rem; color:#94a3b8; font-weight:500; }
        .detail-value { font-size:1rem; font-weight:700; color:#0f172a; }
        .btn-zen { border-radius:12px; font-weight:600; padding:.7rem 1.5rem; }
        @media(max-width:991px){.main-content{margin-left:0}}
    </style>
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="main-content">
    <div style="max-width:600px;margin:0 auto;">

        <div class="mb-4 text-center">
            <div style="font-size:3rem;margin-bottom:.5rem;">🎯</div>
            <h2 style="font-size:1.6rem;font-weight:700;">¡Tu plan está listo!</h2>
            <p class="text-muted">Aquí está el resumen de tu meta de ahorro.</p>
        </div>

        <div class="zen-card p-4 mb-3">
            <div class="detail-row">
                <div class="detail-icon" style="background:#fef3c7;">📂</div>
                <div>
                    <div class="detail-label">Categoría</div>
                    <div class="detail-value" th:text="${categoria}">Educación</div>
                </div>
            </div>
            <div class="detail-row">
                <div class="detail-icon" style="background:#fee2e2;">📅</div>
                <div>
                    <div class="detail-label">Días para alcanzar tu meta</div>
                    <div class="detail-value" th:text="${dias} + ' días'">0 días</div>
                </div>
            </div>
            <div class="detail-row">
                <div class="detail-icon" style="background:#dbeafe;">🔄</div>
                <div>
                    <div class="detail-label">Frecuencia de ahorro</div>
                    <div class="detail-value" th:text="${intervaloTexto}">Mensual</div>
                </div>
            </div>
            <div class="detail-row">
                <div class="detail-icon" style="background:#dcfce7;">💵</div>
                <div>
                    <div class="detail-label">Deberás abonar</div>
                    <div class="detail-value" th:text="'$' + ${abonoFormateado} + ' cada ' + ${intervaloTexto}">$0</div>
                </div>
            </div>
        </div>

        <div class="zen-card p-4 mb-3" style="background:linear-gradient(135deg,#eff6ff,#f0fdf4);border:1px solid #bfdbfe;">
            <p class="mb-0 text-center" style="color:#1e40af;font-size:.95rem;">
                <i class="bi bi-lightbulb-fill me-2" style="color:#f59e0b;"></i>
                Guarda este plan y ve a tu sección de progreso para empezar a registrar tus abonos.
            </p>
        </div>

        <div class="d-flex gap-3">
            <a th:href="@{'/ahorro/paso3'(id=${metaAhorro.id})}" class="btn btn-zen btn-outline-secondary flex-fill">← Atrás</a>
            <a th:href="@{'/ahorro/progreso?id=' + ${id}}" class="btn btn-zen btn-success flex-fill">Comenzar a ahorrar →</a>
        </div>
    </div>
</div>
</body>
</html>
