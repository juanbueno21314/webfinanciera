<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Minijuegos Financieros</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h2 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #0d6efd;
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease;
        }

        .card {
            border: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 32px rgba(0,0,0,0.2);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #343a40;
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        .btn-warning {
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container py-5 text-center">
    <h2>🎮 Minijuegos Financieros</h2>
    <div class="row g-4">
        <!-- Juego 1 -->
        <div class="col-md-4">
            <div class="card h-100 p-3">
                <div class="card-body">
                    <div class="emoji">🤔</div>
                    <h5 class="card-title">Verdadero o Falso</h5>
                    <p class="card-text">¿Puedes detectar los mitos financieros?</p>
                    <p class="text-muted small" th:text="'🏅 Tu mejor puntaje: ' + ${mejorVF} + '/4'">🏅 Tu mejor puntaje: 0/4</p>
                    <a href="/juegos/verdaderoFalso" class="btn btn-primary">¡Jugar ahora!</a>
                </div>
            </div>
        </div>

        <!-- Juego 2 (ejemplo) -->
        <div class="col-md-4">
            <div class="card h-100 p-3">
                <div class="card-body">
                    <div class="emoji">💰</div>
                    <h5 class="card-title">Ahorra y Gana</h5>
                    <p class="card-text">Elige la mejor opción para ahorrar mensualmente.</p>
                    <p class="text-muted small" th:text="'🏅 Tu mejor puntaje: ' + ${mejorAhorra} + '/3'">🏅 Tu mejor puntaje: 0/3</p>
                    <a href="/juegos/ahorraGana" class="btn btn-primary">¡Jugar ahora!</a>
                </div>
            </div>
        </div>
    </div>
    <div class="mt-5">
        <a href="/dashboard" class="btn btn-warning">← Volver al inicio</a>
    </div>
</div>
</body>
</html>
