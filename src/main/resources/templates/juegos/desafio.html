<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modo Desafío - Finanzas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to right, #f7f8fc, #dbeafe);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .desafio-box {
            max-width: 750px;
            margin: auto;
            padding: 3rem;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.15);
            animation: fadeIn 0.6s ease-in;
        }
        h3 {
            font-size: 2rem;
            color: #dc3545;
            margin-bottom: 1.5rem;
            font-weight: bold;
        }
        .question {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        .btn-game {
            width: 45%;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 12px;
        }
        .feedback {
            font-size: 1.1rem;
            margin-top: 1.5rem;
            min-height: 60px;
        }
        .timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: #dc3545;
        }
        .btn-warning {
            margin-top: 1rem;
        }
        .fade {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .fade.show {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="desafio-box text-center fade show" id="desafio">
        <h3>⚡ Modo Desafío</h3>
        <p class="timer" id="temporizador">Tiempo restante: 10s</p>
        <p class="question" id="pregunta">Cargando pregunta...</p>

        <div class="d-flex justify-content-center gap-3 flex-wrap">
            <button class="btn btn-success btn-game" onclick="responder(true)">✅ Verdadero</button>
            <button class="btn btn-danger btn-game" onclick="responder(false)">❌ Falso</button>
        </div>

        <p id="feedback" class="feedback"></p>
    </div>
</div>

<script>
    let preguntas = [
        {
            texto: "Usar la tarjeta de crédito para todo es siempre una buena estrategia de ahorro.",
            respuesta: false,
            explicacion: "Usarla en exceso puede generar deudas por intereses altos."
        },
        {
            texto: "Tener un fondo de emergencia te protege en momentos imprevistos.",
            respuesta: true,
            explicacion: "Es clave para evitar endeudarse cuando ocurre algo inesperado."
        },
        {
            texto: "Comprar en cuotas sin intereses es lo mismo que pagar al contado.",
            respuesta: false,
            explicacion: "Aunque no hay intereses, te comprometes a pagos futuros que afectan tu flujo de caja."
        },
        {
            texto: "Guardar el 10% de tu ingreso cada mes es una buena meta de ahorro.",
            respuesta: true,
            explicacion: "Ahorrar un porcentaje fijo ayuda a crear hábitos financieros."
        },
        {
            texto: "Invertir siempre es riesgoso y se debe evitar si eres joven.",
            respuesta: false,
            explicacion: "Mientras más joven, más tiempo tienes para asumir riesgos y aprender."
        }
    ];

    preguntas = preguntas.sort(() => Math.random() - 0.5);

    let index = 0;
    let aciertos = 0;
    let tiempo = 10;
    let intervalo;

    function iniciarTemporizador() {
        tiempo = 10;
        document.getElementById("temporizador").textContent = `Tiempo restante: ${tiempo}s`;
        intervalo = setInterval(() => {
            tiempo--;
            document.getElementById("temporizador").textContent = `Tiempo restante: ${tiempo}s`;
            if (tiempo <= 0) {
                clearInterval(intervalo);
                mostrarFeedback(false, true);
            }
        }, 1000);
    }

    function cargarPregunta() {
        const p = preguntas[index];
        document.getElementById("pregunta").textContent = p.texto;
        document.getElementById("feedback").textContent = "";
        document.getElementById("desafio").classList.remove("show");
        setTimeout(() => {
            document.getElementById("desafio").classList.add("show");
        }, 100);
        iniciarTemporizador();
    }

    function responder(opcion) {
        clearInterval(intervalo);
        const actual = preguntas[index];
        const correcto = actual.respuesta === opcion;
        mostrarFeedback(correcto);
    }

    function mostrarFeedback(correcto, porTiempo = false) {
        const actual = preguntas[index];
        const feedback = document.getElementById("feedback");

        feedback.innerHTML = correcto
            ? `✔️ <strong>Correcto:</strong> ${actual.explicacion}`
            : `❌ <strong>${porTiempo ? 'Tiempo agotado.' : 'Incorrecto'}:</strong> ${actual.explicacion}`;

        if (correcto) aciertos++;

        setTimeout(() => {
            index++;
            if (index < preguntas.length) {
                cargarPregunta();
            } else {
                mostrarResultados();
            }
        }, 2500);
    }

    function mostrarResultados() {
        const total = preguntas.length;
        let mensaje = aciertos === total ? '🏆 ¡Eres un experto bajo presión!'
                    : aciertos >= total / 2 ? '🎯 Buen intento, sigue practicando.'
                    : '📘 Revisa las lecciones para mejorar.';

        guardarPuntajeFinal("modo_desafio", aciertos);

        document.querySelector(".desafio-box").innerHTML = `
            <h3>🎉 Desafío completado</h3>
            <p>Acertaste ${aciertos} de ${total} preguntas.</p>
            <p>${mensaje}</p>
            <a href="/juegos" class="btn btn-primary">Volver a minijuegos</a>
        `;
    }

     function guardarPuntajeFinal(juego, puntaje) {
        fetch('/api/puntajes/guardar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                juego: juego,
                puntaje: puntaje
            })
        }).then(res => {
            if (!res.ok) {
                console.warn("⚠️ No se pudo guardar el puntaje.");
            }
        });
    }
    cargarPregunta();
</script>

</body>
</html>
