<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ahorra y Gana - Zenfi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/zenfi_icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at top left,rgba(13,110,253,.08),transparent 28%),radial-gradient(circle at bottom right,rgba(25,135,84,.06),transparent 30%),linear-gradient(135deg,#f8fafc,#eef2f7); font-family:"Segoe UI",sans-serif; color:#0f172a; }
        .main-content { margin-left:260px; padding:2rem; min-height:100vh; }
        .zen-card { background:#fff; border-radius:20px; box-shadow:0 8px 24px rgba(15,23,42,.08); border:none; padding:2rem; }
        .form-control,.form-select { border-radius:12px; padding:.7rem 1rem; border:1px solid #e2e8f0; }
        .form-control:focus,.form-select:focus { border-color:#86b7fe; box-shadow:0 0 0 .2rem rgba(13,110,253,.12); }
        .btn-zen { border-radius:12px; font-weight:600; padding:.7rem 1.5rem; }
        .result-box { border-radius:14px; padding:1.25rem; animation:slide-in .3s ease; }
        @keyframes slide-in { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .porc-label { font-size:.8rem; color:#94a3b8; margin-top:.25rem; }
        .health-bar-track { height:14px; background:#e2e8f0; border-radius:999px; overflow:hidden; }
        .health-bar-fill { height:100%; border-radius:999px; transition:width .6s ease, background .6s ease; }
        .round-badge { display:inline-flex; align-items:center; gap:.4rem; background:#eff6ff; color:#1d4ed8; border-radius:999px; padding:.3rem .85rem; font-size:.82rem; font-weight:700; }
        .event-card { background:#fef3c7; border:1px solid #fde68a; border-radius:14px; padding:1rem 1.25rem; margin-bottom:1.25rem; }
        .savings-display { text-align:center; background:linear-gradient(135deg,#ecfdf5,#d1fae5); border-radius:14px; padding:1rem; margin-bottom:1.25rem; }
        .savings-display .amount { font-size:1.6rem; font-weight:800; color:#16a34a; }
        @media(max-width:991px){.main-content{margin-left:0}}
    </style>
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="main-content">
    <div style="max-width:640px;margin:0 auto;">

        <div class="mb-3">
            <a href="/juegos" style="font-size:.85rem;color:#64748b;text-decoration:none;">← Juegos</a>
            <h2 style="font-size:1.6rem;font-weight:700;margin-top:.25rem;">💸 Ahorra y Gana</h2>
            <p class="text-muted mb-0">Simula 3 meses de finanzas reales. Enfrenta eventos inesperados y toma las mejores decisiones.</p>
        </div>

        <!-- Panel de salud financiera -->
        <div class="zen-card mb-3" id="healthPanel" style="padding:1.25rem;">
            <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                <div>
                    <span class="round-badge" id="roundBadge">📅 Mes 1 de 3</span>
                </div>
                <div style="text-align:right;">
                    <div style="font-size:.75rem;color:#94a3b8;font-weight:600;text-transform:uppercase;">Salud financiera</div>
                    <div style="font-size:1.1rem;font-weight:800;color:#0d6efd;" id="healthPct">100%</div>
                </div>
            </div>
            <div class="health-bar-track">
                <div class="health-bar-fill" id="healthFill" style="width:100%;background:#22c55e;"></div>
            </div>
            <div class="d-flex justify-content-between mt-2" style="font-size:.78rem;color:#94a3b8;">
                <span>Ahorros acumulados: <strong id="savingsAcc" style="color:#16a34a;">$0</strong></span>
                <span>Estrellas: <strong id="totalStars">0⭐</strong></span>
            </div>
        </div>

        <!-- Tarjeta de juego -->
        <div class="zen-card" id="gameCard">

            <!-- Evento del mes -->
            <div id="eventCard" class="event-card" style="display:none;">
                <p style="margin:0;font-size:.92rem;" id="eventText"></p>
            </div>

            <!-- Presupuesto disponible -->
            <div class="savings-display">
                <div style="font-size:.78rem;color:#64748b;font-weight:600;margin-bottom:.25rem;">PRESUPUESTO DISPONIBLE ESTE MES</div>
                <div class="amount" id="budgetDisplay">$1.000.000</div>
            </div>

            <!-- Inputs de distribución -->
            <div class="row g-3 mb-4" id="inputsArea">
                <div class="col-6">
                    <label class="form-label fw-semibold">🏠 Vivienda</label>
                    <input type="text" class="form-control currency" id="vivienda" placeholder="$0">
                    <div class="porc-label" id="porc-vivienda"></div>
                </div>
                <div class="col-6">
                    <label class="form-label fw-semibold">🍽️ Alimentación</label>
                    <input type="text" class="form-control currency" id="alimentacion" placeholder="$0">
                    <div class="porc-label" id="porc-alimentacion"></div>
                </div>
                <div class="col-6">
                    <label class="form-label fw-semibold">🎮 Entretenimiento</label>
                    <input type="text" class="form-control currency" id="entretenimiento" placeholder="$0">
                    <div class="porc-label" id="porc-entretenimiento"></div>
                </div>
                <div class="col-6">
                    <label class="form-label fw-semibold">💎 Ahorro</label>
                    <input type="text" class="form-control currency" id="ahorro" placeholder="$0">
                    <div class="porc-label" id="porc-ahorro"></div>
                </div>
            </div>

            <button class="btn btn-zen btn-success w-100" onclick="evaluar()">Cerrar este mes →</button>

            <div id="resultado" class="result-box mt-4" style="display:none;"></div>
        </div>

        <!-- Pantalla final -->
        <div class="zen-card" id="finalCard" style="display:none;text-align:center;">
        </div>

    </div>
</div>

<script>
const EVENTOS = [
    {texto:"🚨 Emergencia médica: tienes un gasto imprevisto de $200.000.",afecta:-200000},
    {texto:"💼 ¡Ingreso extra! Hiciste un trabajo freelance y ganaste $250.000 adicionales.",afecta:250000},
    {texto:"🔧 Se dañó un electrodoméstico. Reparación: $150.000.",afecta:-150000},
    {texto:"🎁 Te devolvieron un dinero prestado. Recuperas $180.000.",afecta:180000},
    {texto:"⚡ La factura de servicios subió más de lo esperado: $120.000 extra.",afecta:-120000},
    {texto:"📦 Encontraste una oferta y ahorraste $100.000 en compras del mes.",afecta:100000},
    {texto:"🏥 Tuviste que comprar medicamentos no planeados: $80.000.",afecta:-80000},
    {texto:"🎉 Premio de la empresa: bono de $300.000.",afecta:300000}
];

const BASES = [1000000, 900000, 850000]; // presupuesto base por mes
let ronda = 0, healthPct = 100, totalAhorros = 0, totalEstrellas = 0;
let budgetActual = BASES[0];
let eventoActual = null;

function formatPesos(v) { return "$" + Math.abs(v).toLocaleString("es-CO"); }
function parseValue(v) { return parseInt(v.replace(/[^\d]/g, "") || 0); }

function iniciarMes() {
    budgetActual = BASES[ronda];
    eventoActual = null;

    // Evento aleatorio desde mes 2
    if (ronda > 0 && Math.random() < 0.75) {
        eventoActual = EVENTOS[Math.floor(Math.random() * EVENTOS.length)];
        budgetActual += eventoActual.afecta;
        budgetActual = Math.max(400000, budgetActual);
        document.getElementById("eventCard").style.display = "block";
        document.getElementById("eventText").innerHTML = `<strong>⚠️ Evento del mes:</strong> ${eventoActual.texto}`;
    } else {
        document.getElementById("eventCard").style.display = "none";
    }

    document.getElementById("roundBadge").textContent = `📅 Mes ${ronda + 1} de 3`;
    document.getElementById("budgetDisplay").textContent = formatPesos(budgetActual);
    document.getElementById("resultado").style.display = "none";
    ["vivienda","alimentacion","entretenimiento","ahorro"].forEach(id => {
        document.getElementById(id).value = "";
        document.getElementById("porc-" + id).textContent = "";
    });
    actualizarPorcentajes();
}

document.querySelectorAll('.currency').forEach(input => {
    input.addEventListener('input', function() {
        let v = this.value.replace(/[^\d]/g, "");
        this.value = v ? "$" + new Intl.NumberFormat("es-CO").format(v) : "";
        actualizarPorcentajes();
    });
});

function actualizarPorcentajes() {
    ["vivienda","alimentacion","entretenimiento","ahorro"].forEach(id => {
        const val = parseValue(document.getElementById(id).value);
        const pct = budgetActual > 0 ? (val / budgetActual * 100).toFixed(1) : 0;
        document.getElementById("porc-" + id).textContent = pct > 0 ? `${pct}% del presupuesto` : "";
    });
}

function actualizarHealth() {
    healthPct = Math.max(0, Math.min(100, healthPct));
    document.getElementById("healthPct").textContent = Math.round(healthPct) + "%";
    const fill = document.getElementById("healthFill");
    fill.style.width = healthPct + "%";
    fill.style.background = healthPct >= 70 ? "#22c55e" : healthPct >= 40 ? "#f59e0b" : "#ef4444";
    document.getElementById("savingsAcc").textContent = formatPesos(totalAhorros);
    document.getElementById("totalStars").textContent = totalEstrellas + "⭐";
}

function evaluar() {
    const vivienda = parseValue(document.getElementById("vivienda").value);
    const alimentacion = parseValue(document.getElementById("alimentacion").value);
    const entretenimiento = parseValue(document.getElementById("entretenimiento").value);
    const ahorro = parseValue(document.getElementById("ahorro").value);
    const distribuido = vivienda + alimentacion + entretenimiento + ahorro;

    let estrellas = 0, consejos = [];

    if (distribuido <= budgetActual) estrellas++;
    else consejos.push("💸 Te excediste del presupuesto disponible.");

    if (ahorro >= 0.2 * budgetActual) estrellas++;
    else consejos.push("💎 Intenta ahorrar al menos el 20% del presupuesto.");

    if (entretenimiento <= 0.2 * budgetActual) estrellas++;
    else consejos.push("🎮 El entretenimiento superó el 20%. Intenta reducirlo.");

    totalEstrellas += estrellas;
    totalAhorros += ahorro;

    // Ajustar salud financiera
    healthPct += (estrellas === 3 ? 10 : estrellas === 2 ? 0 : -15);
    actualizarHealth();

    const color = estrellas === 3 ? "#dcfce7;color:#166534;border:1px solid #bbf7d0" : estrellas === 2 ? "#fef3c7;color:#92400e;border:1px solid #fde68a" : "#fee2e2;color:#991b1b;border:1px solid #fecaca";
    const msg = estrellas === 3 ? "🎉 <strong>¡Excelente mes!</strong> Tomaste decisiones muy inteligentes." : estrellas === 2 ? "⚠️ <strong>Mes aceptable.</strong> Hay espacio para mejorar." : "😓 <strong>Mes difícil.</strong> Revisa tus prioridades.";

    const resultado = document.getElementById("resultado");
    resultado.style.cssText = `background:#${color};display:block;`;
    resultado.innerHTML = `
        <div style="font-size:1.4rem;margin-bottom:.5rem;">${"⭐".repeat(estrellas)}${"☆".repeat(3 - estrellas)}</div>
        <p style="margin:.25rem 0;">${msg}</p>
        <p style="font-size:.85rem;margin:.25rem 0;"><strong>Distribuiste:</strong> ${formatPesos(distribuido)} de ${formatPesos(budgetActual)}</p>
        <p style="font-size:.85rem;margin:.25rem 0;"><strong>Ahorraste:</strong> ${formatPesos(ahorro)}</p>
        ${consejos.length ? '<ul style="margin:.5rem 0 0;padding-left:1.2rem;font-size:.85rem;">' + consejos.map(c => `<li>${c}</li>`).join("") + "</ul>" : ""}
        <button onclick="siguienteMes()" class="btn btn-zen btn-primary mt-3 w-100">${ronda < 2 ? "Siguiente mes →" : "Ver resultado final →"}</button>
    `;
}

function siguienteMes() {
    ronda++;
    if (ronda >= 3) {
        mostrarFinal();
    } else {
        iniciarMes();
    }
}

function mostrarFinal() {
    guardarPuntajeFinal("ahorra_gana", totalEstrellas);
    document.getElementById("gameCard").style.display = "none";
    document.getElementById("healthPanel").style.display = "none";

    const perfil = totalEstrellas >= 8 ? { icon:"🏆", titulo:"Experto Financiero", desc:"¡Tomas decisiones sobresalientes! Tienes un excelente control del dinero." }
        : totalEstrellas >= 5 ? { icon:"📈", titulo:"Ahorrador Comprometido", desc:"Vas por buen camino. Con más disciplina, llegarás lejos." }
        : { icon:"📘", titulo:"En Formación", desc:"Hay áreas por mejorar. Revisa las lecciones de Zenfi y vuelve a intentarlo." };

    document.getElementById("finalCard").style.display = "block";
    document.getElementById("finalCard").innerHTML = `
        <div style="padding:1rem 0;">
            <div style="font-size:3.5rem;margin-bottom:1rem;">${perfil.icon}</div>
            <h4 class="fw-bold">${perfil.titulo}</h4>
            <p class="text-muted">${perfil.desc}</p>
            <div style="display:flex;gap:2rem;justify-content:center;margin:1.25rem 0;flex-wrap:wrap;">
                <div><div style="font-size:.75rem;color:#94a3b8;font-weight:600;text-transform:uppercase;">Total ahorrado</div><div style="font-size:1.4rem;font-weight:800;color:#16a34a;">${formatPesos(totalAhorros)}</div></div>
                <div><div style="font-size:.75rem;color:#94a3b8;font-weight:600;text-transform:uppercase;">Estrellas</div><div style="font-size:1.4rem;font-weight:800;color:#f59e0b;">${totalEstrellas} / 9 ⭐</div></div>
                <div><div style="font-size:.75rem;color:#94a3b8;font-weight:600;text-transform:uppercase;">Salud final</div><div style="font-size:1.4rem;font-weight:800;color:#0d6efd;">${Math.round(healthPct)}%</div></div>
            </div>
            <div class="d-flex gap-3 justify-content-center flex-wrap">
                <a href="/juegos/ahorraGana" class="btn btn-zen btn-success">Jugar de nuevo</a>
                <a href="/juegos" class="btn btn-zen btn-outline-secondary">Volver a juegos</a>
            </div>
        </div>`;
}

function guardarPuntajeFinal(juego, puntaje) {
    fetch('/api/puntajes/guardar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({juego, puntaje}) });
}

// Arrancar
iniciarMes();
actualizarHealth();
</script>
</body>
</html>
